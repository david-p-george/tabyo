      (https://creativecommons.org/licenses/by/4.0/). Modifications: this
      edition presents the text with readings adapted by the editor, as
      annotated throughout.
  bsb:
    name: "Berean Standard Bible"
    licence: "Public domain"
    attribution: >-
      The Holy Bible, Berean Standard Bible, produced in cooperation with Bible
      Hub, Discovery Bible, OpenBible.com, and the Berean Bible Translation
